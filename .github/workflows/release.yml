name: Release

on:
  push:
    branches: [main]
  # Lets you force a release when the merged commits classify as "none" --
  # the level chosen here overrides what the commit subjects say.
  workflow_dispatch:
    inputs:
      level:
        description: Bump level to force
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Never two releases at once: both would read the same base version and the
# second would clobber the first's tag. Queue instead of cancelling -- a
# cancelled run could leave a tag pushed with no release attached.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: bump + tag
    runs-on: ubuntu-latest
    # The release commit is itself a push to main. GITHUB_TOKEN pushes do not
    # re-trigger workflows, so this guard is belt-and-braces -- but it is what
    # makes the loop provably closed rather than relying on that behaviour.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    outputs:
      released: ${{ steps.decide.outputs.released }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bump is derived from every commit since the last
          # tag, and tags are not fetched at the default depth of 1.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Verify before bumping, not after: a tag is public the moment it is
      # pushed and cannot be quietly withdrawn.
      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Decide next version
        id: decide
        run: |
          if [[ -n "${{ inputs.level }}" ]]; then
            current=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\([^"]*\)".*/\1/p;}' Cargo.toml | head -1)
            IFS=. read -r ma mi pa <<<"$current"
            case "${{ inputs.level }}" in
              major) next="$((ma + 1)).0.0" ;;
              minor) next="${ma}.$((mi + 1)).0" ;;
              patch) next="${ma}.${mi}.$((pa + 1))" ;;
            esac
            echo "Forced ${{ inputs.level }} bump: $current -> $next"
          else
            next=$(.github/scripts/next-version.sh)
          fi

          if [[ "$next" == none ]]; then
            echo "No feat/fix/perf/revert commits since the last tag -- nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Write version, changelog and notes
        if: steps.decide.outputs.released == 'true'
        run: |
          version=${{ steps.decide.outputs.version }}
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)

          .github/scripts/set-version.sh "$version"

          # Notes are generated once and reused: the changelog entry and the
          # GitHub release body must not drift apart.
          .github/scripts/release-notes.sh "$version" "$previous" > /tmp/notes.md
          cat /tmp/notes.md

          # Newest section first, directly under the file's preamble.
          header=$(sed -n '1,/^<!-- releases -->$/p' CHANGELOG.md)
          body=$(sed -n '/^<!-- releases -->$/,$p' CHANGELOG.md | tail -n +2)
          { printf '%s\n\n' "$header"; cat /tmp/notes.md; printf '%s' "$body"; } > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Commit and tag
        if: steps.decide.outputs.released == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m 'chore(release): ${{ steps.decide.outputs.tag }}'
          git tag -a '${{ steps.decide.outputs.tag }}' -F /tmp/notes.md
          git push origin HEAD:main --follow-tags

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.released == 'true'
        with:
          name: release-notes
          path: /tmp/notes.md
          retention-days: 1

  build:
    name: ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # gnu is the fast path on any mainstream distro; musl is the fully
          # static fallback for anything with an older or absent glibc.
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the tag, not the branch tip, so the binary reports exactly
          # the version being released.
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # tree-sitter grammars are C, so the musl target needs a musl-targeting
      # C compiler and linker as well as the Rust std for it.
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked -p omv --target ${{ matrix.target }}

      - name: Package
        run: |
          name="omv-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/omv" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp examples/config.yaml "dist/$name/config.example.yaml"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: github release
    needs: [version, build]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ needs.version.outputs.tag }}' \
            --title '${{ needs.version.outputs.tag }}' \
            --notes-file artifacts/release-notes/notes.md \
            artifacts/binaries-*/*.tar.gz \
            artifacts/binaries-*/*.tar.gz.sha256
