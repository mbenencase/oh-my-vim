# Installed by the-office. Continuous-monitoring control, not a PR gate:
# see .github/workflows/deps.yml. An advisory published overnight is not a
# reason to block an unrelated pull request, but it is a reason to open an issue.
#
# Measured at install time (cargo-deny 0.20.2, 265 crates in the graph):
#   advisories  0
#   bans        0
#   sources     0
#   licences    0 against the allow-list below
#
# The allow-list is pinned to the licences actually present, not to a general
# policy. A new licence entering the tree should be a decision, so it fails here
# and someone adds a line.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# omv itself is MIT. Everything below is permissive and MIT-compatible, with one
# exception called out explicitly.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # MPL-2.0 is weak (file-level) copyleft, not permissive like the rest.
    # It arrives via nucleo / nucleo-matcher (the fuzzy matcher behind the
    # pickers) and option-ext (via dirs). Linking them into a distributed
    # binary is fine and imposes no obligation on omv's own source; modifying
    # *their* files would oblige you to publish those files. Nobody is doing
    # that today. Listed separately so the choice stays visible rather than
    # blending into the permissive block.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Duplicates are a fact of a 265-crate graph (bitflags, hashbrown, syn,
# thiserror and thiserror-impl each appear twice today). Worth seeing, not worth
# blocking on -- deduplicating them means waiting on upstream, not on us.
multiple-versions = "warn"
# "warn", not "deny", and the reason is specific. The six internal crates are
# declared `omv-*.workspace = true`: a path with no version requirement, which
# cargo-deny reads as a wildcard. That is deliberate and load-bearing -- see
# .github/scripts/set-version.sh. A `^0.1.0` requirement stops matching the
# instant the workspace reaches 0.2.0 and the release build fails on the tag.
#
# `allow-wildcard-paths = true` does not help: cargo-deny exempts path wildcards
# only for crates marked `publish = false`, and these are not marked. Marking
# them would be accurate (they cannot go to crates.io while their internal deps
# carry no version) but it is a decision about the project's future, not a
# harness decision, so it is left to a human. Until then this stays a warning.
# Measured: 3 wildcard warnings (omv, omv-config, omv-syntax), all internal.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
