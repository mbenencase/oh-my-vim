# Installed by the-office. Global strictness is OFF on purpose.
#
# On a legacy codebase, turning strict on repo-wide produces a wall of errors
# that no one triages. Instead: opt modules in one at a time, as a task on the
# board, and let the ratchet do the work.
[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True

# Opt a module in by copying this block and naming the module.
# [mypy-yourpkg.newmodule.*]
# disallow_untyped_defs = True
# strict_optional = True
